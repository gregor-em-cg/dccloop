name: Frozen inputs and geometry

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Verify frozen input bytes
        run: python3 -B tools/check_frozen.py
      - name: Geometry predicates only (no Blender or provider)
        working-directory: prototypes/local
        run: python3 -B -m unittest tests.test_fluted_candidate_v4 -v
